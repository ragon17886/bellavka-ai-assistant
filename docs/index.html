<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellavka Admin</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="apple-touch-icon" href="./assets/favicon.png">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        :root {
            --primary-dark: #154734;
            --primary-light: #d4eb8e;
            --background: #ffffff;
            --text: #1a1a1a;
            --text-light: #666666;
            --border: #e0e0e0;
            --shadow: 0 2px 12px rgba(21, 71, 52, 0.08);
            --transition: all 0.2s ease;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }
        
        /* Header */
        .header {
            background: var(--primary-dark);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-light);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo {
            height: 32px;
            width: auto;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Navigation */
        .nav {
            background: var(--background);
            padding: 0 2rem;
            border-bottom: 1px solid var(--border);
        }
        
        .nav-tabs {
            display: flex;
            gap: 0;
        }
        
        .nav-tab {
            background: none;
            border: none;
            color: var(--text-light);
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
            font-weight: 500;
            position: relative;
        }
        
        .nav-tab:hover {
            color: var(--primary-dark);
            background: var(--primary-light);
        }
        
        .nav-tab.active {
            color: var(--primary-dark);
            border-bottom-color: var(--primary-dark);
        }
        
        /* Main Content */
        .main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Cards */
        .card {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .card:hover {
            box-shadow: 0 4px 20px rgba(21, 71, 52, 0.12);
        }
        
        .card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--primary-dark);
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(21, 71, 52, 0.15);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--background);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .data-table th,
        .data-table td {
            padding: 1.25rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        .data-table th {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .data-table tr:hover {
            background: var(--primary-light);
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-dark);
        }
        
        .form-control {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--background);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 3px rgba(21, 71, 52, 0.1);
        }
        
        textarea.form-control {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }
        
        /* Buttons */
        .btn {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn:hover {
            background: #0f3526;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(21, 71, 52, 0.3);
        }
        
        .btn-success {
            background: var(--primary-dark);
        }
        
        .btn-success:hover {
            background: #0f3526;
        }
        
        .refresh-btn {
            background: transparent;
            color: var(--primary-dark);
            border: 1px solid var(--primary-dark);
            padding: 0.75rem 1.5rem;
        }
        
        .refresh-btn:hover {
            background: var(--primary-light);
            transform: none;
            box-shadow: none;
        }
        
        /* Loading & Messages */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            height: 1rem;
            margin-bottom: 0.5rem;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .message {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-10px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .message.success {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-left-color: var(--primary-dark);
        }
        
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border-left-color: #dc2626;
        }
        
        /* Activity Feed */
        .activity-feed {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .activity-item {
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            transition: var(--transition);
        }
        
        .activity-item:hover {
            border-color: var(--primary-dark);
            background: var(--primary-light);
        }
        
        .activity-time {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }
        
        .activity-content {
            color: var(--text);
            line-height: 1.5;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .nav {
                padding: 0 1rem;
            }
            
            .nav-tabs {
                overflow-x: auto;
            }
            
            .main {
                padding: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="./assets/logo.png" alt="FIRMOVA" class="logo" onerror="this.style.display='none'">
            <h1>Bellavka Admin</h1>
        </div>
        <div class="status">
            <div class="status-dot"></div>
            <span>Connected</span>
        </div>
    </header>
    
    <nav class="nav">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('dashboard')">📊 Dashboard</button>
            <button class="nav-tab" onclick="showTab('assistants')">🤖 Assistants</button>
            <button class="nav-tab" onclick="showTab('users')">👥 Users</button>
            <button class="nav-tab" onclick="showTab('dialogs')">💬 Dialogs</button>
        </div>
    </nav>
    
    <main class="main">
        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="stat-users">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-dialogs">0</div>
                    <div class="stat-label">Dialog Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-assistants">0</div>
                    <div class="stat-label">AI Assistants</div>
                </div>
            </div>
            
            <div class="card">
                <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0;">Recent Activity</h3>
                    <button class="btn refresh-btn" onclick="loadRecentActivity()">
                        <span>🔄</span> Refresh
                    </button>
                </div>
                <div id="recent-activity" class="loading">
                    <div class="skeleton" style="width: 80%;"></div>
                    <div class="skeleton" style="width: 60%;"></div>
                    <div class="skeleton" style="width: 70%;"></div>
                </div>
            </div>
        </div>
        
        <!-- Assistants Tab -->
        <div id="assistants" class="tab-content">
            <div class="card">
                <h3>Create New Assistant</h3>
                <form id="assistant-form">
                    <div class="form-group">
                        <label>Assistant Name:</label>
                        <input type="text" class="form-control" name="name" placeholder="e.g., main, sales, support" required>
                    </div>
                    <div class="form-group">
                        <label>System Prompt:</label>
                        <textarea class="form-control" name="system_prompt" placeholder="Define the AI assistant's behavior and knowledge..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <span>✨</span> Create Assistant
                    </button>
                </form>
            </div>
            
            <div class="card">
                <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0;">Assistants List</h3>
                    <button class="btn refresh-btn" onclick="loadAssistants()">
                        <span>🔄</span> Refresh
                    </button>
                </div>
                <div id="assistants-list" class="loading">
                    <div class="skeleton" style="height: 2rem; margin-bottom: 1rem;"></div>
                    <div class="skeleton" style="height: 2rem; margin-bottom: 1rem;"></div>
                    <div class="skeleton" style="height: 2rem;"></div>
                </div>
            </div>
        </div>
        
        <!-- Users Tab -->
        <div id="users" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0;">Registered Users</h3>
                    <button class="btn refresh-btn" onclick="loadUsers()">
                        <span>🔄</span> Refresh
                    </button>
                </div>
                <div id="users-list" class="loading">
                    <div class="skeleton" style="height: 2rem; margin-bottom: 1rem;"></div>
                    <div class="skeleton" style="height: 2rem; margin-bottom: 1rem;"></div>
                    <div class="skeleton" style="height: 2rem;"></div>
                </div>
            </div>
        </div>
        
        <!-- Dialogs Tab -->
        <div id="dialogs" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0;">Recent Dialogs</h3>
                    <button class="btn refresh-btn" onclick="loadDialogs()">
                        <span>🔄</span> Refresh
                    </button>
                </div>
                <div id="dialogs-list" class="loading">
                    <div class="skeleton" style="height: 2rem; margin-bottom: 1rem;"></div>
                    <div class="skeleton" style="height: 2rem; margin-bottom: 1rem;"></div>
                    <div class="skeleton" style="height: 2rem;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'https://bellavka-ai-assistant-worker.ragon17886.workers.dev/api/admin';
        
        // Tab Management
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            loadTabData(tabName);
        }
        
        // Load data for specific tab
        function loadTabData(tabName) {
            switch(tabName) {
                case 'dashboard':
                    loadStats();
                    loadRecentActivity();
                    break;
                case 'assistants':
                    loadAssistants();
                    break;
                case 'users':
                    loadUsers();
                    break;
                case 'dialogs':
                    loadDialogs();
                    break;
            }
        }
        
        // API Functions
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}/${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                showMessage(`API Error: ${error.message}`, 'error');
                throw error;
            }
        }
        
        // Load Statistics
        async function loadStats() {
            try {
                const stats = await apiCall('stats');
                document.getElementById('stat-users').textContent = stats.users;
                document.getElementById('stat-dialogs').textContent = stats.dialogs;
                document.getElementById('stat-assistants').textContent = stats.assistants;
            } catch (error) {
                document.getElementById('stats-grid').innerHTML = '<div class="message error">Failed to load statistics</div>';
            }
        }
        
        // Load Recent Activity
        async function loadRecentActivity() {
            try {
                const dialogs = await apiCall('dialogs?limit=8');
                const html = dialogs.length > 0 
                    ? `<div class="activity-feed">
                         ${dialogs.map(d => `
                           <div class="activity-item">
                             <div class="activity-time">${new Date(d.timestamp).toLocaleString()}</div>
                             <div class="activity-content">
                               <strong>User ${d.tg_id}</strong> (${d.role}): ${d.content?.substring(0, 80)}${d.content?.length > 80 ? '...' : ''}
                             </div>
                           </div>
                         `).join('')}
                       </div>`
                    : '<div class="message">No recent activity</div>';
                document.getElementById('recent-activity').innerHTML = html;
            } catch (error) {
                document.getElementById('recent-activity').innerHTML = '<div class="message error">Failed to load activity</div>';
            }
        }
        
        // Load Assistants
        async function loadAssistants() {
            try {
                const assistants = await apiCall('assistants');
                const html = assistants.length > 0 
                    ? `<table class="data-table">
                         <thead>
                           <tr>
                             <th>Name</th>
                             <th>Type</th>
                             <th>Status</th>
                             <th>Created</th>
                           </tr>
                         </thead>
                         <tbody>
                           ${assistants.map(a => `
                             <tr>
                               <td><strong>${a.name}</strong></td>
                               <td>${a.type}</td>
                               <td>${a.is_active ? '✅ Active' : '❌ Inactive'}</td>
                               <td>${new Date(a.created_at).toLocaleDateString()}</td>
                             </tr>
                           `).join('')}
                         </tbody>
                       </table>`
                    : '<div class="message">No assistants found. Create your first assistant above.</div>';
                document.getElementById('assistants-list').innerHTML = html;
            } catch (error) {
                document.getElementById('assistants-list').innerHTML = '<div class="message error">Failed to load assistants</div>';
            }
        }
        
        // Load Users
        async function loadUsers() {
            try {
                const users = await apiCall('users');
                const html = users.length > 0 
                    ? `<table class="data-table">
                         <thead>
                           <tr>
                             <th>ID</th>
                             <th>Name</th>
                             <th>Last Activity</th>
                             <th>Registered</th>
                           </tr>
                         </thead>
                         <tbody>
                           ${users.map(u => `
                             <tr>
                               <td><code>${u.tg_id}</code></td>
                               <td>${u.full_name || '—'}</td>
                               <td>${u.last_activity ? new Date(u.last_activity).toLocaleDateString() : 'Never'}</td>
                               <td>${new Date(u.created_at).toLocaleDateString()}</td>
                             </tr>
                           `).join('')}
                         </tbody>
                       </table>`
                    : '<div class="message">No users found</div>';
                document.getElementById('users-list').innerHTML = html;
            } catch (error) {
                document.getElementById('users-list').innerHTML = '<div class="message error">Failed to load users</div>';
            }
        }
        
        // Load Dialogs
        async function loadDialogs() {
            try {
                const dialogs = await apiCall('dialogs');
                const html = dialogs.length > 0 
                    ? `<table class="data-table">
                         <thead>
                           <tr>
                             <th>Time</th>
                             <th>User</th>
                             <th>Role</th>
                             <th>Message</th>
                           </tr>
                         </thead>
                         <tbody>
                           ${dialogs.map(d => `
                             <tr>
                               <td style="white-space: nowrap;">${new Date(d.timestamp).toLocaleString()}</td>
                               <td><code>${d.tg_id}</code></td>
                               <td>
                                 <span style="
                                   background: ${d.role === 'user' ? '#dbeafe' : d.role === 'assistant' ? '#dcfce7' : '#f3e8ff'};
                                   color: ${d.role === 'user' ? '#1e40af' : d.role === 'assistant' ? '#166534' : '#7e22ce'};
                                   padding: 0.25rem 0.5rem;
                                   border-radius: 4px;
                                   font-size: 0.8rem;
                                   font-weight: 500;
                                 ">${d.role}</span>
                               </td>
                               <td>${d.content?.substring(0, 100)}${d.content?.length > 100 ? '...' : ''}</td>
                             </tr>
                           `).join('')}
                         </tbody>
                       </table>`
                    : '<div class="message">No dialogs found</div>';
                document.getElementById('dialogs-list').innerHTML = html;
            } catch (error) {
                document.getElementById('dialogs-list').innerHTML = '<div class="message error">Failed to load dialogs</div>';
            }
        }
        
        // Create Assistant
        document.getElementById('assistant-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const assistant = {
                name: formData.get('name'),
                type: 'ai',
                system_prompt: formData.get('system_prompt'),
                is_active: true
            };
            
            try {
                await apiCall('assistants', {
                    method: 'POST',
                    body: JSON.stringify(assistant)
                });
                showMessage('Assistant created successfully!', 'success');
                e.target.reset();
                loadAssistants();
            } catch (error) {
                showMessage('Failed to create assistant', 'error');
            }
        });
        
        // Utility Functions
        function showMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.querySelector('.main').prepend(message);
            setTimeout(() => message.remove(), 5000);
        }
        
        // Auto-refresh for dashboard
        function startAutoRefresh() {
            setInterval(() => {
                if (document.getElementById('dashboard').classList.contains('active')) {
                    loadStats();
                    loadRecentActivity();
                }
            }, 10000);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadRecentActivity();
            startAutoRefresh();
        });
    </script>
</body>
</html>
